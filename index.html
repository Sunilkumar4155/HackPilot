<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/HackPilot/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="HACKPILOT — AI-Powered Hackathon Discovery & Team Finder.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HACKPILOT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HACKPILOT — Your Innovation. Our Direction.</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #07090D;
      color: #F5F7FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
    }
    .logo-box {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #FF6818, #FF9A62);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 104, 24, 0.4);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .logo-box svg {
      width: 32px;
      height: 32px;
      fill: #FFFFFF;
    }
    .title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      color: #FF9A62;
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 104, 24, 0.15);
      border-top: 2.5px solid #FF6818;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="logo-box">
      <svg viewBox="0 0 24 24">
        <path d="M12 2.5s-4 4.5-4 9.5c0 2.21 1.79 4 4 4s4-1.79 4-4c0-5-4-9.5-4-9.5zm0 11.5c-1.1 0-2-.9-2-2 0-2.12 1.39-4.49 2-5.41.61.92 2 3.29 2 5.41 0 1.1-.9 2-2 2zM6 19.5c0-.83.67-1.5 1.5-1.5h9c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-9c-.83 0-1.5-.67-1.5-1.5z"/>
      </svg>
    </div>
    <div class="title">HACKPILOT</div>
    <div class="tagline">YOUR INNOVATION. OUR DIRECTION.</div>
    <div class="spinner"></div>
  </div>

  <!-- Flutter Web Bootstrap script -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
