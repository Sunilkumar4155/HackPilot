name: "🚀 HackPilot Enterprise QA, Security, Load & 300 E2E Automation"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: hackpilot-qa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  FLUTTER_VERSION: "3.24.5"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Master QA Pipeline: Follows Steps 1 - 12 in Exact Order
  # ════════════════════════════════════════════════════════════════════════════
  hackpilot-qa:
    name: "🧪 HackPilot Complete QA Pipeline (300 E2E, Load & Security)"
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # Step 1: Checkout repository
      - name: "📥 1. Checkout repository"
        uses: actions/checkout@v4

      # Setup runtimes (Zero pip cache to prevent missing requirements.txt error)
      - name: "📦 Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Step 2: Install Flutter using a suitable GitHub Action
      - name: "💙 2. Install Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 3: Run flutter pub get
      - name: "📦 3. Run flutter pub get"
        run: flutter pub get

      # Run Flutter code analysis & unit tests
      - name: "🔍 Run Flutter code analysis"
        run: flutter analyze

      - name: "🧪 Run Flutter unit and widget tests"
        run: flutter test

      - name: "📋 Publish 400-Point Unit Summary to Step Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs flutter-unit

      # Step 4: Build actual Flutter web application using flutter build web --release
      - name: "🏗️ 4. Build actual Flutter web application"
        run: flutter build web --release --no-tree-shake-icons

      # Steps 5, 6, 7: Start local HTTP server on port 8080 & health check loop
      - name: "🚀 5-7. Start background web server & verify health check"
        run: |
          nohup python3 -m http.server 8080 --directory build/web > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server running in background with PID: $SERVER_PID"
          echo "Waiting for http://127.0.0.1:8080/index.html to return HTTP 200..."
          HEALTHY=0
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/index.html || echo "000")
            echo "Health check attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "SUCCESS: Actual HackPilot web app is listening (HTTP 200) on attempt $i!"
              HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ $HEALTHY -ne 1 ]; then
            echo "CRITICAL: Server failed to start on http://127.0.0.1:8080/index.html after 30 attempts!"
            echo "=== Server Output Log ==="
            cat server.log || true
            exit 1
          fi

      # Step 8: Install E2E dependencies in e2e_tests
      - name: "📦 8. Install E2E Node Dependencies"
        working-directory: e2e_tests
        run: npm install

      # Steps 8 & 9: Execute npm run test:web from e2e_tests with Selenium configured to http://127.0.0.1:8080
      - name: "🧪 8-9. Execute 300 Real Web E2E Test Cases against Actual App"
        env:
          BASE_URL: "http://127.0.0.1:8080"
        working-directory: e2e_tests
        run: npm run test:web

      # Step 10: Publish Individual Test Results (Test Reporter)
      - name: "📊 10. Publish Individual Test Results (Test Reporter)"
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "🧪 300 Web E2E Test Cases (Selenium)"
          path: "e2e_tests/reports/web/junit-results.xml"
          reporter: "java-junit"
          fail-on-error: true

      - name: "📋 Publish 300-Point E2E Summary to Step Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs web-e2e

      # Execute Authorized Load Test against the live server (Uses 100% standard library Python)
      - name: "⚡ Execute Multi-Stage Load Concurrency Test (5 - 100 VUs)"
        env:
          TARGET_URL: "http://127.0.0.1:8080"
          OUTPUT_DIR: "load-test-reports"
        run: python3 .github/scripts/run-load-test.py

      - name: "📋 Publish 400-Point Load Summary to Step Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs load

      # Execute Security & Vulnerability Scans (Uses 100% standard library Python)
      - name: "🛡️ Execute Threat Model & Security Audit Script"
        run: python3 testing/security/run_security_audit.py

      - name: "📜 Validate Firestore Security Rules Syntax"
        run: |
          test -f firestore.rules || (echo "CRITICAL: firestore.rules missing!" && exit 1)
          grep -q "request.auth.uid" firestore.rules || (echo "CRITICAL: User isolation not found in firestore.rules" && exit 1)
          echo "Firestore security rules verified."

      - name: "📊 Generate Security Reports & Excel Findings"
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: node .github/scripts/generate-security-reports.cjs

      - name: "📋 Publish 400-Point Security Summary to Step Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs security

      # Generate Master Unified Summary Dashboard
      - name: "📋 Generate Unified QA Summary Dashboard"
        if: always()
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
        run: node .github/scripts/generate-unified-summary.cjs

      # Step 11: Upload E2E, security and load-test artifacts using if: always()
      - name: "📤 11a. Upload 300 Web E2E Artifacts (Excel, HTML, JUnit XML & Screenshots)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            e2e_tests/reports/web/
            testing/reports/screenshots/
          retention-days: 7

      - name: "📤 11b. Upload Load Test Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-artifacts
          path: load-test-reports/
          retention-days: 7

      - name: "📤 11c. Upload Security Audit Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-findings-artifacts
          path: |
            Vulnerability Test Results/
            testing/reports/security-findings.json
          retention-days: 7

      - name: "📤 11d. Upload Master Unified Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-unified-qa-reports
          path: unified-reports/
          retention-days: 7
