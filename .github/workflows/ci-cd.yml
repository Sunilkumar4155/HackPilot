name: HackPilot CI/CD Master Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-flutter-tests:
    name: Flutter Lint, Unit & Widget Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dart & Flutter Dependencies
        run: flutter pub get

      - name: Static Code Analysis (0 Warnings Policy)
        run: flutter analyze

      - name: Run Unit & Widget Test Suite
        run: |
          mkdir -p testing/reports
          flutter test --coverage --reporter=json > testing/reports/flutter-test-results.json || flutter test --coverage

      - name: Upload Test Results & Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-test-coverage
          path: |
            testing/reports/
            coverage/lcov.info

  build-web-and-deploy:
    name: Build Flutter Web & Deploy to GitHub Pages
    needs: lint-and-flutter-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web (HTML & CanvasKit Hybrid)
        run: flutter build web --release --base-href "/HackPilot/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

  build-android-apk:
    name: Build Android Debug & Release Artifacts
    needs: lint-and-flutter-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackpilot-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

