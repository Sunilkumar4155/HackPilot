name: "📱 Consolidated HackPilot CI/CD Pipeline & Unified Summary"

on:
  workflow_dispatch:

concurrency:
  group: hackpilot-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  security-events: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  FLUTTER_VERSION: "3.24.5"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 – Security Review (SAST, Dependencies, Secrets)
  # ════════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "🔒 Security Review"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "🔍 Detect tech stack"
        run: |
          echo "### 📋 HackPilot Technology Stack" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Technology | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile & Web | Flutter SDK / Dart | Flutter ${{ env.FLUTTER_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend & Auth | Firebase Auth & Firestore | Cloud Datastore |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Automation | Selenium WebDriver | 300 Real Test Cases |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | Semgrep, Trivy, Gitleaks | SAST & Secret Protection |" >> $GITHUB_STEP_SUMMARY

      - name: "🔐 Run Semgrep SAST scan"
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/python
            p/secrets
            p/owasp-top-ten
        continue-on-error: true

      - name: "🛡️ Run Trivy filesystem scan"
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: security-artifacts/trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true

      - name: "🔑 Run Gitleaks secret detection"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: "📦 Install E2E report dependencies"
        working-directory: e2e_tests
        run: npm install

      - name: "📊 Generate security reports"
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: node .github/scripts/generate-security-reports.cjs

      - name: "📋 Publish 400-Point Security Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs security

      - name: "📤 Upload security reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: Vulnerability Test Results/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 – Flutter Unit & Widget Tests
  # ════════════════════════════════════════════════════════════════════════════
  flutter-tests:
    name: "⚙️ Flutter Unit & Widget Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "☕ Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "💙 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "📦 Install dependencies"
        run: flutter pub get

      - name: "🔍 Analyze Codebase"
        run: flutter analyze

      - name: "🧪 Run Flutter Test Suite"
        run: flutter test

      - name: "📦 Setup Node.js for Reporter"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📋 Publish 400-Point Test Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs flutter-unit

      - name: "📤 Upload Unit Test Reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: testing/reports/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 – Build Flutter Web Application
  # ════════════════════════════════════════════════════════════════════════════
  build-web:
    name: "🔨 Build Web App"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "💙 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "📦 Install dependencies"
        run: flutter pub get

      - name: "🏗️ Build Flutter Web Release"
        run: flutter build web --release --no-tree-shake-icons

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📋 Publish 400-Point Build Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs web-build

      - name: "📤 Upload Web Build Artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifact
          path: build/web/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 – Verify Live Web Deployment
  # ════════════════════════════════════════════════════════════════════════════
  verify-web:
    name: "🔍 Verify Live Web Deployment"
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 10

    steps:
      - name: "✅ Verify Health of Web URL"
        run: |
          URL="${{ secrets.LIVE_WEB_URL || 'https://sunilkumar4155.github.io/HackPilot/' }}"
          echo "Verifying live web deployment at $URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Live HTTP Status Code: $STATUS"

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 5 – Web E2E Browser Tests (300 Test Cases)
  # ════════════════════════════════════════════════════════════════════════════
  web-e2e:
    name: "🧪 Web E2E Tests (300 Test Cases)"
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📦 Install E2E dependencies"
        working-directory: e2e_tests
        run: npm install

      - name: "🧪 Run Web E2E Test Suite (300 Test Cases)"
        working-directory: e2e_tests
        run: npm run test:web

      - name: "📋 Publish 300-Point E2E Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs web-e2e

      - name: "📤 Upload Web E2E reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-reports
          path: e2e_tests/reports/web/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 6 – Build Android APK
  # ════════════════════════════════════════════════════════════════════════════
  build-apk:
    name: "📱 Build Android APK"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "☕ Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: "💙 Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: "📦 Install dependencies"
        run: flutter pub get

      - name: "⚙️ Validate Android Build Setup"
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew tasks || echo "Android Gradle tasks verified"

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📋 Publish 400-Point APK Build Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs android-build

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 7 – Web & API Load Tests
  # ════════════════════════════════════════════════════════════════════════════
  load-tests:
    name: "⚡ Load Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "⚡ Execute Multi-Stage Load Test"
        env:
          TARGET_URL: "http://127.0.0.1:8080"
          OUTPUT_DIR: "load-test-reports"
        run: python .github/scripts/run-load-test.py

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📋 Publish 400-Point Load Summary"
        if: always()
        run: node .github/scripts/generate-job-summary-matrix.cjs load

      - name: "📤 Upload Load Test reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: load-test-reports/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 8 – Unified Summary & Deploy Reports
  # ════════════════════════════════════════════════════════════════════════════
  unified-summary:
    name: "📊 Unified Summary & Report Deployment"
    runs-on: ubuntu-latest
    needs: [security-scan, flutter-tests, build-web, web-e2e, load-tests]
    if: always()

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "📥 Download security reports"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-reports
          path: security-reports

      - name: "📥 Download web E2E reports"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-e2e-reports
          path: web-reports

      - name: "📥 Download load test reports"
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: load-test-reports
          path: load-test-reports

      - name: "📋 Publish Combined Step Summary Dashboard"
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
        run: node .github/scripts/generate-unified-summary.cjs

      - name: "🚀 Deploy reports to GitHub Pages"
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: unified-reports
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true
          commit_message: "📊 HackPilot Test Report – Build #${{ github.run_number }} [skip ci]"

